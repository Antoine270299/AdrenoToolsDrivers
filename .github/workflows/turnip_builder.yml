name: Build "turnip"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt install build-essential flex bison glslang-tools
        sudo apt install meson-1.5 

    - name: Execute build script
      run: bash ./turnip_builder.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: turnip-linear-V${{ inputs.version }}
        path: /tmp/mainline-turnip-linear-V${{ inputs.version }}.zip

    - name: Release "turnip"
      uses: softprops/action-gh-release@v1
      with:
        body: |
          Turnip A8XX (whitebelyash turnip/gen8) with a linear swapchain fix for Android devices
          where Mesa falls back to its generic gralloc backend (Qualcomm SnapAlloc / IMapper5,
          Android 16+). Fixes striped or garbled emulator output on Adreno 8xx.
          Test build, see patches_linear/.
        tag_name: linear_v${{ inputs.version }}
        name: Turnip linear swapchain fix v${{ inputs.version }}
        files: |
           /tmp/mainline-turnip-linear-V${{ inputs.version }}.zip
