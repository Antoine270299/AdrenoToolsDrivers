name: Build "turnip"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt install build-essential flex bison glslang-tools
        sudo apt install meson-1.5 

    - name: Execute build script
      run: bash ./turnip_builder.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: turnip-linear-V${{ inputs.version }}
        path: /tmp/mainline-turnip-linear-V${{ inputs.version }}.zip

    - name: Release "turnip"
      uses: softprops/action-gh-release@v1
      with:
        body: |
          **HN Turnip** — Mesa Turnip for Adreno 8xx (whitebelyash's turnip/gen8 branch) with
          HexNostalgia's linear swapchain fix.

          On Android 16+ with Qualcomm's SnapAlloc allocator, Mesa can't query how screen buffers
          are laid out and falls back to its generic gralloc backend, which assumes a linear
          layout while Android picks a compressed tiled one: emulators using Turnip show red bands
          or striped output. In that fallback case this build asks for CPU-readable screen buffers,
          which makes the layout linear. Patch: patches_linear/.

          Not an official Mesa or whitebelyash build. Credits: the Mesa project (MIT license),
          whitebelyash (Adreno 8xx support), ilhan-athn7 (builder scripts).
        tag_name: hn_turnip_v${{ inputs.version }}
        name: HN Turnip v${{ inputs.version }}
        files: |
           /tmp/mainline-turnip-linear-V${{ inputs.version }}.zip
